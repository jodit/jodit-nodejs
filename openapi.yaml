            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /generatePdf:
    get:
      operationId: generatePdf
      summary: Generate PDF document
      description: Converts HTML content to PDF format
      tags:
        - Documents
      parameters:
        - schema:
            type: string
            enum:
              - generatePdf
            description: Action name
            example: generatePdf
          required: false
          description: Action name
          name: action
          in: query
        - schema:
            type: string
            minLength: 1
            description: HTML content to convert to PDF
            example: <h1>Hello World</h1><p>This is a test document.</p>
          required: true
          description: HTML content to convert to PDF
          name: html
          in: query
        - schema:
            anyOf:
              - type: string
              - type: object
                properties:
                  format:
                    type: string
                    enum:
                      - A4
                      - A3
                      - Letter
                      - Legal
                      - Tabloid
                    description: Paper format
                  page_orientation:
                    type: string
                    enum:
                      - portrait
                      - landscape
                    description: Page orientation
                  defaultFont:
                    type: string
                    enum:
                      - courier
                      - helvetica
                      - times
                    description: Default font for PDF (only standard PDF fonts supported)
            description: PDF generation options
          required: false
          description: PDF generation options
          name: options
          in: query
      responses:
        "200":
          description: PDF file successfully generated
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "400":
          description: Bad request - missing html parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error - failed to generate PDF
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
