site_name: Jodit Connector Node.js
site_description: Node.js/TypeScript implementation of the Jodit File Browser and Uploader connector
site_author: Jodit Team
site_url: https://jodit.github.io/jodit-nodejs/

repo_name: jodit/jodit-nodejs
repo_url: https://github.com/jodit/jodit-nodejs
edit_uri: edit/main/docs/content/

docs_dir: content
site_dir: ../dist/site

theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

plugins:
  - swagger-ui:
      spec_url: https://jodit.github.io/jodit-nodejs/openapi.yaml
      outfile: api-reference.md
  - search
  - awesome-pages


markdown_extensions:
  - toc:
      permalink: true
      toc_depth: 3
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - def_list

nav:
  - Getting Started: index.md
  - Usage:
      - Installation & Setup: installation.md
      - API Usage: api-usage.md
      - Express Integration: express-integration.md
  - Reference:
      - API Endpoints: api-reference.md
      - Authentication: authentication.md
      - Access Control: access-control.md
      - Configuration: config.md
      - Storage Adapters: storage-adapters.md
  - Development:
      - Testing: testing.md
      - Architecture: architecture.md
  - Deployment:
      - Docker: docker.md
      - CI/CD & Deployment: deployment.md
  - API Reference: api-reference.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/jodit/jodit-nodejs
    - icon: fontawesome/brands/npm
      link: https://www.npmjs.com/package/jodit-nodejs
  version:
    provider: mike

copyright: Copyright &copy; 2025 Jodit Team