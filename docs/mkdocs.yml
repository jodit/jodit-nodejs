site_name: Jodit Connector Node.js
site_description: Node.js/TypeScript implementation of the Jodit File Browser and Uploader connector
site_author: Jodit Team
site_url: https://jodit.github.io/jodit-nodejs/

repo_name: jodit/jodit-nodejs
repo_url: https://github.com/jodit/jodit-nodejs
edit_uri: edit/main/docs/content/

docs_dir: content
site_dir: ../dist/site

theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: white
      accent: white
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: white
      accent: white
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    # - navigation.instant
    # - navigation.instant.prefetch
    - navigation.tracking
    # - navigation.sections
    - navigation.path
    - navigation.indexes
  #   - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.action.edit

plugins:
  - swagger-ui-tag
  # - swagger-ui:
      # spec_url: https://jodit.github.io/jodit-nodejs/openapi.yaml
      # outfile: api-swagger.md
  - search
  - awesome-pages

nav:
  - Getting Started: index.md
  - Usage:
      - Installation & Setup: installation.md
      - API Usage: api-usage.md
      - Express Integration: express-integration.md
  - Reference:
      - API Endpoints: api.md
      - API Reference: api-swagger.md
      - Authentication: authentication.md
      - Access Control: access-control.md
      - Configuration: config.md
      - Storage Adapters: storage-adapters.md
  - Development:
      - Testing: testing.md
      - Architecture: architecture.md
  - Deployment:
      - Docker: docker.md
      - CI/CD & Deployment: deployment.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/jodit/jodit-nodejs
    - icon: fontawesome/brands/npm
      link: https://www.npmjs.com/package/jodit-nodejs
  version:
    provider: mike

copyright: Copyright &copy; 2025 Jodit Team